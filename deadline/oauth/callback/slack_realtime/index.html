<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none';">
    <title>Nonlate - Slack Live Sync OAuth</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        .open-button {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.9rem 1.25rem;
            border-radius: 14px;
            background: #60a5fa;
            color: #07111f;
            font-weight: 700;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        const callbackPath = 'slack_realtime';
        const appUrl = 'deadline://oauth/callback/' + callbackPath + window.location.search;

        function openNonlate(stage) {
            window.location.href = appUrl;
        }

        function startRedirect() {
            const manualLink = document.getElementById('manual-link');
            const link = document.getElementById('link');
            if (link) {
                link.href = appUrl;
            }
            if (manualLink) {
                manualLink.style.display = 'block';
            }
            [0, 700, 1500, 2800, 4500, 6500, 9000, 12000].forEach(function(delay, index) {
                setTimeout(function() {
                    openNonlate('redirect_attempt_' + (index + 1));
                }, delay);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startRedirect);
        } else {
            startRedirect();
        }
    </script>
    <script src="/deadline/oauth/callback/oauth-ui.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Connecting to Nonlate...</h2>
        <p>Redirecting you back to the app</p>
        <div id="manual-link" style="display: none; margin-top: 1rem;">
            <p>Not redirected automatically?</p>
            <a id="link" class="open-button" href="#">Open Nonlate</a>
        </div>
    </div>
</body>
</html>
