<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLine - Slack Live Sync OAuth</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        .open-button {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.9rem 1.25rem;
            border-radius: 14px;
            background: #60a5fa;
            color: #07111f;
            font-weight: 700;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        const callbackPath = 'slack_realtime';
        const appUrl = 'deadline://oauth/callback/' + callbackPath + window.location.search;
        const diagnosticUrl = 'https://deadline-opal.vercel.app/api/oauth-bridge';
        const queryKeys = Array.from(new URLSearchParams(window.location.search).keys());

        function reportBridge(stage) {
            const params = new URLSearchParams(window.location.search);
            const payload = JSON.stringify({
                platform: callbackPath,
                stage: stage,
                has_code: params.has('code'),
                has_state: params.has('state'),
                query_keys: queryKeys
            });
            const blob = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
            if (navigator.sendBeacon && navigator.sendBeacon(diagnosticUrl, blob)) {
                return;
            }
            fetch(diagnosticUrl, {
                method: 'POST',
                body: payload,
                mode: 'no-cors',
                keepalive: true
            }).catch(function() {});
        }

        function openDeadLine(stage) {
            reportBridge(stage || 'redirect_attempt');
            window.location.href = appUrl;
        }

        function startRedirect() {
            const manualLink = document.getElementById('manual-link');
            const link = document.getElementById('link');
            if (link) {
                link.href = appUrl;
                link.addEventListener('click', function() {
                    reportBridge('manual_click');
                });
            }
            if (manualLink) {
                manualLink.style.display = 'block';
            }
            reportBridge('loaded');
            [0, 700, 1500, 2800, 4500, 6500, 9000, 12000].forEach(function(delay, index) {
                setTimeout(function() {
                    openDeadLine('redirect_attempt_' + (index + 1));
                }, delay);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startRedirect);
        } else {
            startRedirect();
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Connecting to DeadLine...</h2>
        <p>Redirecting you back to the app</p>
        <div id="manual-link" style="display: none; margin-top: 1rem;">
            <p>Not redirected automatically?</p>
            <a id="link" class="open-button" href="#">Open Nonlate</a>
        </div>
    </div>
</body>
</html>
